# ─────────────────────────────────────────────────────────────
#  Painel Ambiente — configuração
#  Reinicie o servidor depois de alterar este arquivo.
# ─────────────────────────────────────────────────────────────

[servidor]
porta = 8765
# true = permite abrir http://<ip-do-pc>:8765/remote no celular para mutar o microfone.
# Clientes remotos recebem SOMENTE o estado do microfone, nunca a transcrição.
rede_local = false

[local]
# Se latitude/longitude ficarem comentadas, a cidade é localizada automaticamente.
cidade = "São Paulo"
pais = "BR"
# latitude = -23.5505
# longitude = -46.6333

[widgets]
moedas = ["USD-BRL", "EUR-BRL", "BTC-BRL"]

[[widgets.feeds]]
nome = "g1"
url = "https://g1.globo.com/rss/g1/"

[[widgets.feeds]]
nome = "Agência Brasil"
url = "https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml"

[[widgets.feeds]]
nome = "Folha"
url = "https://feeds.folha.uol.com.br/emcimadahora/rss091.xml"

[tela]
fps_max = 60
# Resolução interna do fundo animado (0.3 – 1.0). Menor = mais leve; o fundo é suave, 0.5 já fica ótimo.
qualidade_fundo = 0.5

[camera]
# A câmera só detecta movimento (64×48 px, tudo no navegador). Nenhuma imagem é salva ou enviada.
ativada = true
# Sem ninguém se mexendo por este tempo, o painel entra em modo ambiente (mais discreto).
ociosidade_minutos = 5
# Gestos só valem para quem está a até esta distância da câmera (metros). Quem passa ao fundo é ignorado.
distancia_gestos = 2.0
# Ângulo de visão horizontal da webcam, em graus (usado para estimar a distância). Notebooks: ~60–70.
# Se a distância mostrada em Ajustes não bater com a real, ajuste aqui.
campo_visao = 65

[audio]
ativado = true
iniciar_mutado = false
# Parte do nome do microfone (ex.: "USB"). Vazio = microfone padrão do Windows.
microfone = ""
# auto | tiny | base | small | medium | large-v3-turbo | large-v3
# "auto" = large-v3-turbo com GPU NVIDIA, small só com CPU. Também dá para trocar na tela (botão Ajustes).
modelo_whisper = "auto"
# auto | cuda | cpu
dispositivo_whisper = "auto"
# Idioma falado na sala: "pt" (português do Brasil), "en" (inglês) ou "auto" (o Whisper detecta).
# Também dá para trocar na tela (Ajustes → Transcrição da fala).
idioma = "pt"
# Ganho do microfone em dB (-12 a +24). Aumente se o microfone capta baixo. Também ajustável em Ajustes.
ganho_db = 0
# A transcrição fica só na memória e é descartada depois deste tempo.
retencao_minutos = 10
# Muta sozinho quando outro app (Teams, Zoom, Meet no navegador...) estiver usando o microfone.
mute_automatico = true
# Aumente (ex.: 1.5) se ele não estiver captando falas mais baixas; diminua se captar ruído.
sensibilidade = 1.0

[zak]
# Zak: a tela vira a cena do assunto da conversa (em vez dos cards) e atende "Ei, Zak".
# true = o Zak é a tela padrão. Para experimentar sem mudar aqui: http://localhost:8765/?zak  (demonstração: /?zak&demo)
ativado = false
# Proteção de informação: a tela mostra só o tema, sem falas, nomes ou números, e nada de assuntos
# pessoais/delicados. Também liga e desliga em Ajustes (o que for escolhido lá vale mais).
protecao = true
# A cada quantos segundos o modo ambiente olha a conversa recente.
ambiente_segundos = 20
# Voz: "kokoro" (local, na CPU; baixa ~340 MB na primeira vez) ou "nenhum" (só legenda).
voz_motor = "kokoro"
# Vozes masculinas pt-BR do Kokoro: pm_alex (padrão), pm_santa.
voz = "pm_alex"
voz_velocidade = 1.0
# Imagens geradas localmente para ideias e atmosferas: "auto" (Z-Image-Turbo com GPU de 12 GB ou mais),
# "nenhum", ou o id de outro modelo do Hugging Face (ex.: "black-forest-labs/FLUX.1-schnell").
imagem_modelo = "auto"

[ia]
ollama_url = "http://localhost:11434"
# Modelo inicial. Qualquer modelo instalado no Ollama pode ser escolhido na tela (botão Ajustes).
modelo = "qwen3:8b"
intervalo_segundos = 40
janela_minutos = 6
